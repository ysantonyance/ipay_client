<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link type="image/png" sizes="32x32" rel="icon" href="/icons8-amazon-shopping-app-24.png">

    <!-- What Google shows as the blue title and the grey text under it -->
    <title>IPAY - Online Shopping</title>
    <meta name="description" content="Shop products from sellers around the world on IPAY. Browse categories, add to your cart and check out securely." />

    <meta property="og:site_name" content="IPAY" />
    <meta property="og:title" content="IPAY - Online Shopping" />
    <meta property="og:description" content="Shop products from sellers around the world on IPAY." />

    <meta name="twitter:title" content="IPAY - Online Shopping" />
